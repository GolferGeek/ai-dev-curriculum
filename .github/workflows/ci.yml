name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Curriculum structure
        run: ./scripts/verify-curriculum-structure.sh

      - name: Canonical AI tooling projections
        run: npm run ai:check

      - name: AI program decision system
        run: npm run ai:program:check

      - name: Markdown links
        run: npm run docs:links

      - name: Teaching mind maps
        run: npm run mindmaps:check

      - name: Documentation site
        run: |
          python -m pip install -r docs/requirements.txt
          python -m mkdocs build --strict

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Completed reference applications
        run: npm run completed:check
